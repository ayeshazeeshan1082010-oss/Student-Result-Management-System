<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Student Result Management System</h1>


    <div class="container">


        <label>Student Name:</label>
        <input type="text" id="student" placeholder="Enter Student Name">
        <label>English marks:</label>
        <input type="number" id="english" placeholder="English Marks">
        <label>Maths marks:</label>
        <input type="number" id="maths" placeholder="Maths Marks">
        <label>Urdu marks:</label>
        <input type="number" id="urdu" placeholder="Urdu Marks">
        <label>Computer marks:</label>
        <input type="number" id="computer" placeholder="Computer Marks">
        <label>Biology marks:</label>
        <input type="number" id="biology" placeholder="Biology Marks">

        <button id="total">Calculate Result</button>

    </div>

    <script src="./script.js"></script>
</body>

</html>
